name: Alte Releases entfernen (einmalig)

on:
  push:
    branches: [main]
    paths: ['.github/workflows/aufraeumen.yml']

permissions:
  contents: write
  actions: write

jobs:
  aufraeumen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Laeufe zu alten, ersetzten Commits loeschen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git rev-list HEAD > "$RUNNER_TEMP/jetzt.txt"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" --paginate --jq '.workflow_runs[] | "\(.id) \(.head_sha)"' | while read id sha; do
            if ! grep -qx "$sha" "$RUNNER_TEMP/jetzt.txt"; then
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$id" >/dev/null && echo "Lauf $id (${sha:0:7}) geloescht"
            fi
          done
      - name: Releases und Tags finanz-v28 bis finanz-v40 loeschen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for n in $(seq 28 40); do
            gh release delete "finanz-v$n" -R "$GITHUB_REPOSITORY" --yes --cleanup-tag && echo "finanz-v$n geloescht" || echo "finanz-v$n: kein Release"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/finanz-v$n" >/dev/null 2>&1 && echo "Tag finanz-v$n geloescht" || true
          done
      - name: Build-Ergebnisse v28 bis v40 loeschen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts" --paginate --jq '.artifacts[] | "\(.id) \(.name)"' | while read id name; do
            n="${name##*finanz-v}"
            case "$n" in ''|*[!0-9]*) continue;; esac
            if [ "$n" -ge 28 ] && [ "$n" -le 40 ]; then
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" && echo "$name geloescht"
            fi
          done
