name: Android-APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Abhaengigkeiten installieren
        run: npm ci

      - name: Web-Teil ins Android-Projekt kopieren
        run: npx cap sync android

      - name: Versionsnummer festlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(tr -d ' \r\n' < version.txt)
          if [[ ! "$V" =~ ^finanz-v[0-9]+$ ]]; then
            echo "::error::version.txt muss so aussehen: finanz-v12"; exit 1
          fi
          echo "VERSION_NAME=$V" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${V#finanz-v}" >> "$GITHUB_ENV"
          if gh release view "$V" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "NEUES_RELEASE=nein" >> "$GITHUB_ENV"
            echo "Release $V gibt es schon – nur Test-Build."
          else
            echo "NEUES_RELEASE=ja" >> "$GITHUB_ENV"
            echo "Neue Version $V – signierter Build mit Release."
          fi

      - name: Signier-Schluessel bereitstellen
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [ "$NEUES_RELEASE" = "ja" ]; then
              echo "::error::Secret KEYSTORE_BASE64 fehlt – ein Release ohne Signatur waere nicht ueber die alte Version installierbar."
              exit 1
            fi
            echo "::warning::Secrets fehlen – APK wird unsigniert gebaut (nur Test)."
          else
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/finanz-release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/finanz-release.jks" >> "$GITHUB_ENV"
          fi

      - name: APK bauen
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          cp "$APK" "$GITHUB_WORKSPACE/finanz-app-${VERSION_NAME}.apk"

      - name: Signatur pruefen
        if: env.KEYSTORE_FILE != ''
        run: |
          SIGNER=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)apksigner
          $SIGNER verify --print-certs finanz-app-*.apk | grep -i "SHA-256"

      - name: APK als Build-Ergebnis ablegen
        uses: actions/upload-artifact@v4
        with:
          name: finanz-app-${{ env.VERSION_NAME }}
          path: finanz-app-*.apk

      - name: Release anlegen (nur bei neuer Nummer in version.txt)
        if: env.NEUES_RELEASE == 'ja'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION_NAME" finanz-app-*.apk \
            --target "$GITHUB_SHA" \
            --title "$VERSION_NAME" \
            --notes "APK auf dem Handy herunterladen und über die alte Version installieren."
