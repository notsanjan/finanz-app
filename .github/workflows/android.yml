name: Android-APK

on:
  push:
    branches: [main]
    tags: ['finanz-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Abhaengigkeiten installieren
        run: npm ci

      - name: Web-Teil ins Android-Projekt kopieren
        run: npx cap sync android

      - name: Versionsnummer festlegen
        run: |
          if [[ "$GITHUB_REF" == refs/tags/finanz-v* ]]; then
            NR="${GITHUB_REF_NAME#finanz-v}"
            echo "VERSION_CODE=$NR" >> "$GITHUB_ENV"
            echo "VERSION_NAME=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          else
            echo "VERSION_CODE=1" >> "$GITHUB_ENV"
            echo "VERSION_NAME=dev-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      - name: Signier-Schluessel bereitstellen
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              echo "::error::Secret KEYSTORE_BASE64 fehlt – ein Release ohne Signatur waere nicht ueber die alte Version installierbar."
              exit 1
            fi
            echo "::warning::Secrets fehlen noch – APK wird unsigniert gebaut (nur Test)."
          else
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/finanz-release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/finanz-release.jks" >> "$GITHUB_ENV"
          fi

      - name: APK bauen
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          cp "$APK" "$GITHUB_WORKSPACE/finanz-app-${VERSION_NAME}.apk"

      - name: APK als Build-Ergebnis ablegen
        uses: actions/upload-artifact@v4
        with:
          name: finanz-app-${{ env.VERSION_NAME }}
          path: finanz-app-*.apk

      - name: Release anlegen (nur bei finanz-vX)
        if: startsWith(github.ref, 'refs/tags/finanz-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" finanz-app-*.apk \
            --title "$GITHUB_REF_NAME" \
            --notes "APK auf dem Handy herunterladen und über die alte Version installieren."
